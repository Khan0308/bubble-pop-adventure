
name: Build Bubble Pop Adventure Android APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository source code
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Set up Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 4. Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 5. Install Android SDK packages
      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 6. Install project dependencies
      - name: Install web dependencies
        run: npm install

      # 7. Build React web application
      - name: Build web game
        run: npm run build

      # 8. Check Capacitor configuration
      - name: Check Capacitor
        run: |
          node -e "require.resolve('@capacitor/core')"
          node -e "require.resolve('@capacitor/android')"

      # 9. Create Android project if it does not exist
      - name: Generate Android wrapper
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      # 10. Sync web application with Android
      - name: Sync Android project
        run: npx cap sync android

      # 11. Configure portrait orientation
      - name: Configure portrait orientation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          content, count = re.subn(
              r'<activity\b(?![^>]*android:screenOrientation=)',
              '<activity android:screenOrientation="portrait"',
              content,
              count=1
          )

          if count == 0:
              print("Activity orientation already configured or activity not found.")
          else:
              manifest.write_text(content)
              print("Portrait orientation configured.")
          PY

      # 12. Make Gradle executable
      - name: Set Gradle permissions
        run: chmod +x android/gradlew

      # 13. Build Android debug APK
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      # 14. Upload APK as downloadable artifact
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Bubble-Pop-Adventure-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
