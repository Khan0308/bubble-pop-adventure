
name: Build Bubble Pop Adventure Android APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Setup Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 4. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 5. Configure Android SDK
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      # 6. Install Android SDK packages
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 7. Verify project
      - name: Verify project files
        run: |
          test -f package.json || {
            echo "ERROR: package.json not found"
            exit 1
          }

      # 8. Install dependencies
      - name: Install npm dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      # 9. Verify Capacitor packages
      - name: Verify Capacitor dependencies
        run: |
          npm ls @capacitor/core @capacitor/cli @capacitor/android --depth=0

      # 10. Build React application
      - name: Build web application
        run: npm run build

      # 11. Check Capacitor configuration
      - name: Check Capacitor configuration
        run: |
          if [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.js ]; then
            echo "ERROR: Capacitor configuration is missing."
            exit 1
          fi

      # 12. Add Android platform if missing
      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      # 13. Sync web application
      - name: Sync Android project
        run: npx cap sync android

      # 14. Configure portrait orientation
      - name: Configure portrait orientation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml not found")

          content = manifest.read_text()

          match = re.search(r'<activity\b[^>]*>', content)

          if not match:
              raise SystemExit("No activity element found")

          activity = match.group(0)

          if 'android:screenOrientation=' in activity:
              activity = re.sub(
                  r'android:screenOrientation="[^"]*"',
                  'android:screenOrientation="portrait"',
                  activity
              )
          else:
              activity = activity[:-1] + ' android:screenOrientation="portrait">'

          content = content[:match.start()] + activity + content[match.end():]
          manifest.write_text(content)

          print("Portrait orientation configured.")
          PY

      # 15. Check Gradle wrapper
      - name: Check Gradle wrapper
        run: |
          if [ ! -f android/gradlew ]; then
            echo "ERROR: Android Gradle wrapper is missing."
            exit 1
          fi
          chmod +x android/gradlew

      # 16. Build Android debug APK
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      # 17. Verify generated APK
      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      # 18. Upload APK
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Bubble-Pop-Adventure-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
